services:
  app:
    build: .
    image: spliit:latest
    expose:
      - 3000
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:latest
    expose:
      - 5432
    volumes:
      - ./postgres-data:/var/lib/postgresql/
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U postgres' ]
      interval: 5s
      timeout: 5s
      retries: 5
