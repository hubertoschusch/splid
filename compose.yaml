services:
  app:
    build: .
    image: spliit:latest
    expose:
      - 3000
    depends_on:
      db:
        condition: service_healthy
      receipt-ai:
        condition: service_healthy
    environment:
      ENABLE_LOCAL_RECEIPT_OCR: "true"
      RECEIPT_AI_URL: http://receipt-ai:8080

  receipt-ai:
    build: ./receipt-ai
    expose:
      - 8080
    environment:
      OLLAMA_URL: http://receipt-llm:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3-vl:2b-instruct}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-300}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-1024}
    depends_on:
      receipt-model:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 120s

  receipt-llm:
    image: ollama/ollama:0.12.7
    expose:
      - 11434
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  receipt-model:
    image: ollama/ollama:0.12.7
    environment:
      OLLAMA_HOST: http://receipt-llm:11434
    command: ["pull", "${OLLAMA_MODEL:-qwen3-vl:2b-instruct}"]
    depends_on:
      receipt-llm:
        condition: service_healthy
    volumes:
      - ollama-models:/root/.ollama

  db:
    image: postgres:latest
    expose:
      - 5432
    volumes:
      - ./postgres-data:/var/lib/postgresql/
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U postgres' ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ollama-models:
