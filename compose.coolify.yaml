services:
  app:
    build: .
    expose:
      - "3000"

    environment:
      POSTGRES_PRISMA_URL: "postgresql://${SERVICE_USER_DB}:${SERVICE_PASSWORD_64_DB}@${SERVICE_NAME_DB}:5432/spliit"
      POSTGRES_URL_NON_POOLING: "postgresql://${SERVICE_USER_DB}:${SERVICE_PASSWORD_64_DB}@${SERVICE_NAME_DB}:5432/spliit"

      # Optional:
      DEFAULT_CURRENCY_CODE: EUR
      ENABLE_LOCAL_RECEIPT_OCR: "true"
      RECEIPT_AI_URL: http://${SERVICE_NAME_RECEIPT_AI}:8080

    depends_on:
      db:
        condition: service_healthy
      receipt-ai:
        condition: service_healthy

  receipt-ai:
    build: ./receipt-ai
    expose:
      - "8080"
    environment:
      OLLAMA_URL: http://${SERVICE_NAME_RECEIPT_LLM}:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3-vl:2b-instruct}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-300}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-1024}
    depends_on:
      receipt-model:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 120s

  receipt-llm:
    image: ollama/ollama:0.12.7
    expose:
      - "11434"
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  receipt-model:
    image: ollama/ollama:0.12.7
    restart: "no"
    exclude_from_hc: true
    environment:
      OLLAMA_HOST: http://${SERVICE_NAME_RECEIPT_LLM}:11434
    command: ["pull", "${OLLAMA_MODEL:-qwen3-vl:2b-instruct}"]
    depends_on:
      receipt-llm:
        condition: service_healthy
    volumes:
      - ollama-models:/root/.ollama

  db:
    image: postgres:17.3

    expose:
      - "5432"

    environment:
      POSTGRES_USER: ${SERVICE_USER_DB}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_DB}
      POSTGRES_DB: spliit

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  ollama-models:
