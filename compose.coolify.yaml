services:
  app:
    build: .
    expose:
      - "3000"

    environment:
      POSTGRES_PRISMA_URL: "postgresql://${SERVICE_USER_DB}:${SERVICE_PASSWORD_64_DB}@${SERVICE_NAME_DB}:5432/spliit"
      POSTGRES_URL_NON_POOLING: "postgresql://${SERVICE_USER_DB}:${SERVICE_PASSWORD_64_DB}@${SERVICE_NAME_DB}:5432/spliit"

      # Optional:
      DEFAULT_CURRENCY_CODE: EUR
      ENABLE_LOCAL_RECEIPT_OCR: "true"
      PADDLEOCR_URL: http://${SERVICE_NAME_RECEIPT_AI}:8080

    depends_on:
      db:
        condition: service_healthy
      receipt-ai:
        condition: service_healthy

  receipt-ai:
    build: ./receipt-ai
    expose:
      - "8080"
    environment:
      PADDLEOCR_LANG: ${PADDLEOCR_LANG:-la}
      PADDLEOCR_CPU_THREADS: ${PADDLEOCR_CPU_THREADS:-4}
    volumes:
      - paddleocr-models:/root/.paddlex
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 120s

  db:
    image: postgres:17.3

    expose:
      - "5432"

    environment:
      POSTGRES_USER: ${SERVICE_USER_DB}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_DB}
      POSTGRES_DB: spliit

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  paddleocr-models:
